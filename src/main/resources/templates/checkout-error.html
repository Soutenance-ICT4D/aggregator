<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePay</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/logo_sharepay_svg.svg}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#098865',
                            foreground: '#FFFFFF',
                        },
                        border: 'hsl(240 5.9% 90%)',
                        background: 'hsl(0 0% 100%)',
                        foreground: 'hsl(240 10% 3.9%)',
                        muted: {
                            DEFAULT: 'hsl(240 4.8% 95.9%)',
                            foreground: 'hsl(240 3.8% 46.1%)',
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        '2xl': '1rem',
                        'xl': '0.75rem',
                        'lg': '0.5rem',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: hsl(240 10% 3.9%);
        }

        h1, h2, h3, .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center py-8 px-4">

    <div class="max-w-sm w-full space-y-8">

        <!-- Card erreur -->
        <div class="bg-white rounded-2xl border border-border/50 shadow-sm overflow-hidden">

            <!-- SESSION_EXPIRED / COLLECT_EXPIRED -->
            <th:block th:if="${errorCode == 'SESSION_EXPIRED' or errorCode == 'COLLECT_EXPIRED'}">
                <div class="p-8 flex flex-col items-center text-center space-y-4">
                    <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold font-outfit">Lien expiré</h2>
                        <p class="text-sm text-muted-foreground leading-relaxed" th:text="${errorMessage}">Ce lien a expiré.</p>
                    </div>
                </div>
            </th:block>

            <!-- ALREADY_PAID -->
            <th:block th:if="${errorCode == 'ALREADY_PAID'}">
                <div class="p-8 flex flex-col items-center text-center space-y-4">
                    <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12" />
                        </svg>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold font-outfit text-green-600">Déjà payé</h2>
                        <p class="text-sm text-muted-foreground leading-relaxed" th:text="${errorMessage}">Ce paiement a déjà été effectué.</p>
                    </div>
                </div>
            </th:block>

            <!-- COLLECT_CLOSED -->
            <th:block th:if="${errorCode == 'COLLECT_CLOSED'}">
                <div class="p-8 flex flex-col items-center text-center space-y-4">
                    <div class="w-20 h-20 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold font-outfit">Collecte clôturée</h2>
                        <p class="text-sm text-muted-foreground leading-relaxed" th:text="${errorMessage}">Cette collecte est clôturée.</p>
                    </div>
                </div>
            </th:block>

            <!-- NOT_COMPLETED (ticket inaccessible) -->
            <th:block th:if="${errorCode == 'NOT_COMPLETED'}">
                <div class="p-8 flex flex-col items-center text-center space-y-4">
                    <div class="w-20 h-20 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <line x1="16" y1="13" x2="8" y2="13" />
                            <line x1="16" y1="17" x2="8" y2="17" />
                            <polyline points="10 9 9 9 8 9" />
                        </svg>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold font-outfit">Reçu indisponible</h2>
                        <p class="text-sm text-muted-foreground leading-relaxed" th:text="${errorMessage}">Aucun reçu disponible.</p>
                    </div>
                </div>
            </th:block>

            <!-- Tous les autres cas (SESSION_NOT_FOUND, INVALID_SESSION, SESSION_CLOSED, COLLECT_NOT_FOUND, TRANSACTION_NOT_FOUND…) -->
            <th:block th:if="${errorCode != 'SESSION_EXPIRED'
                            and errorCode != 'COLLECT_EXPIRED'
                            and errorCode != 'ALREADY_PAID'
                            and errorCode != 'COLLECT_CLOSED'
                            and errorCode != 'NOT_COMPLETED'}">
                <div class="p-8 flex flex-col items-center text-center space-y-4">
                    <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="15" y1="9" x2="9" y2="15" />
                            <line x1="9" y1="9" x2="15" y2="15" />
                        </svg>
                    </div>
                    <div class="space-y-1">
                        <h2 class="text-xl font-bold font-outfit">Lien invalide</h2>
                        <p class="text-sm text-muted-foreground leading-relaxed" th:text="${errorMessage}">Ce lien est invalide ou indisponible.</p>
                    </div>
                </div>
            </th:block>

            <!-- Code d'erreur -->
            <div class="px-8 pb-6 flex justify-center">
                <span class="text-[10px] font-mono bg-muted text-muted-foreground border border-border/80 px-2.5 py-1 rounded-md"
                    th:text="${errorCode}">ERROR_CODE</span>
            </div>
        </div>

        <!-- Footer sécurité -->
        <div class="flex items-center justify-center space-x-2 text-primary/60 py-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            <span class="text-[11px] font-bold uppercase tracking-widest flex items-center">
                Transactions sécurisées par SharePay
                <img th:src="@{/logo_sharepay_svg.svg}" alt=""
                    class="h-4 w-4 mx-1.5 object-contain inline-block">
                .
            </span>
        </div>

    </div>

</body>
</html>
