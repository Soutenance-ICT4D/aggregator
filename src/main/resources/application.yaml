# Configuration Server
server:
  port: ${SPRING_SERVER_PORT:3001}
  forward-headers-strategy: framework

spring:
  application:
    name: sharepay-aggregator

  web:
    error:
      include-message: always
      include-binding-errors: always

  # Profile actif
  profiles:
    active: ${SPRING_ENV:dev}

  # Configuration PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Configuration JPA
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  # Configuration Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholders:
      adminEmail: ${ADMIN_EMAIL:admin@sharepay.com}
      adminPasswordHash: ${ADMIN_PASSWORD_HASH:$2b$12$gpu6wM25/xNrW7rAgIGqwe5Gq1/jp/9BkVibr4lierdTAOx/RE0Zq}

  # Configuration SMTP
  mail:
    host:     ${MAIL_HOST:smtp.ionos.fr}
    port:     ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth:              true
          starttls:
            enable:          true
            required:        true
          connectiontimeout: 5000
          timeout:           5000
          writetimeout:      5000

# Configuration JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

# Configuration Actuator commune
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuration Springdoc / Swagger UI
springdoc:
  swagger-ui:
    tags-sorter: order
    operations-sorter: method
    default-flat-param-object: true

# ── Configuration des providers de paiement ──────────────────────────────────
payment:
  providers:
    mtn-momo:
      base-url:      ${PAYMENT_BASE_URL}
      i-space-key:   ${PAYMENT_I_SPACE_KEY}
      app-space-key: ${PAYMENT_APP_SPACE_KEY}
      payin-path:    ${PAYMENT_PAYIN_PATH}
      status-path:   ${PAYMENT_STATUS_PATH}
      callback-url:  ${MTN_CALLBACK_URL:http://localhost:8080/api/v1/public/provider-webhook/MTN_MOMO_CM}

    orange-money:
      base-url:      ${PAYMENT_BASE_URL}
      i-space-key:   ${PAYMENT_I_SPACE_KEY}
      app-space-key: ${PAYMENT_APP_SPACE_KEY}
      payin-path:    ${PAYMENT_PAYIN_PATH}
      status-path:   ${PAYMENT_STATUS_PATH}
      notif-url:     ${ORANGE_NOTIF_URL:http://localhost:8080/api/v1/public/provider-webhook/ORANGE_MONEY_CM}

# ── Configuration applicative ────────────────────────────────────────────────
app:
  checkout-base-url: ${CHECKOUT_BASE_URL:http://localhost:3001/checkout/}
  collect-base-url:  ${COLLECT_BASE_URL:http://localhost:3001/collect/}
  website-url:       ${SHAREPAY_URL:https://sharepay.cm}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Configuration Logging commune (surchargée par profil)
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sharepay.aggregator: ${LOG_LEVEL_APP:INFO}
